# =============================================================================
# DECEL Intelligence Platform — local dev + prod
#
# One command: `docker compose up`
#
# Services:
#   - db:   Postgres 16 (data on a named volume, EU/EEA-friendly timezone)
#   - app:  The api-server, serving the API at /api/* and the frontend at /*
#           Built from ./Dockerfile.
#
# Env vars come from .env (copy .env.example to .env and fill in).
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: decel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decel}
      POSTGRES_DB: ${POSTGRES_DB:-decel}
      # Force EU/EEA timezone (§12.5 GDPR — keep personal data timestamps sane)
      TZ: Europe/Stockholm
      PGTZ: Europe/Stockholm
    volumes:
      - decel-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decel} -d ${POSTGRES_DB:-decel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decel-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Use env_file (not environment:) so docker compose does NOT try to
    # interpolate `$` characters in values like the scrypt hash. Values are
    # passed through verbatim from .env.
    env_file:
      - .env
    environment:
      # The api-server's DATABASE_URL points at the db service. This is the
      # only override — every other var comes from .env via env_file above.
      DATABASE_URL: postgres://${POSTGRES_USER:-decel}:${POSTGRES_PASSWORD:-decel}@db:5432/${POSTGRES_DB:-decel}
      # Production hardening
      NODE_ENV: production
      PORT: "5000"
      TZ: Europe/Stockholm
    ports:
      # The api-server listens on :5000 inside the container; Caddy on the
      # host terminates TLS and proxies to this port. HOST_PORT=5000 by
      # default for the Hetzner + Caddy setup.
      - "${HOST_PORT:-5000}:5000"
    volumes:
      # Persist raw source snapshots across container restarts
      - decel-snapshots:/app/data/snapshots
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  decel-db-data:
    name: decel-db-data
  decel-snapshots:
    name: decel-snapshots
