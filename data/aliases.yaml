# =============================================================================
# aliases.yaml — cross-lingual org + yard name resolution
# Spec reference: §12.3, DECISIONS C5 (Aug 22 sign-off).
#
# Owner: Cassin (product). Builder seeds from KNOWN_YARDS / OPERATOR_KEY_ROLES
# (artifacts/api-server/src/routes/search.ts) + the demo seed. Cassin approves
# merges before they land in the live trust-gate path.
#
# Format per entry:
#   canonical:  The "official" name we use everywhere downstream
#   match_key:  ASCII-normalized (diacritics stripped, lowercased) — used for
#               unique dedupe in the orgs table
#   type:       One of the OrgType enum (authority, operator, epc, consultant,
#               financier, competitor, agent)
#   market_ids: [array of market ids this org appears in, e.g. ["pl"]]
#   aliases:    All known spellings / transliterations. Auto-merge to this
#               canonical org happens when an inbound name matches one of
#               these (after ASCII normalization). Mismatches land in the
#               review queue as "possible alias of <canonical>".
# =============================================================================

# ---- Poland (PL) ----
- canonical: PKP Polskie Linie Kolejowe
  match_key: pkp polskie linie kolejowe
  type: authority
  market_ids: [pl]
  aliases:
    - "PKP PLK"
    - "PKP PLK S.A."
    - "Polskie Linie Kolejowe"
    - "PLK"
    - "PKP Cargo / PLK"

- canonical: Axtone
  match_key: axtone
  type: competitor
  market_ids: [pl]
  aliases:
    - "Axtone GmbH"
    - "Axtone SA"
    - "AXTONE"
    - "Axtone retarder systems"

- canonical: SYSTRA
  match_key: systra
  type: consultant
  market_ids: [pl]
  aliases:
    - "SYSTRA SA"
    - "Systra Group"
    - "SYSTRA Group"

