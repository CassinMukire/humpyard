kind = "web"
previewPath = "/"
title = "Hump Yard Market Intelligence"
version = "1.0.0"
id = "artifacts/hump-yard-intel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24110

[services.development]
run = "pnpm --filter @workspace/hump-yard-intel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hump-yard-intel", "run", "build" ]
publicDir = "artifacts/hump-yard-intel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24110"
BASE_PATH = "/"
